name: CI

# Hosted-runner minutes are limited on a free private repository, so CI runs on demand
# (Actions > CI > Run workflow) and for a release tag. Day to day, the full suite runs locally:
# on Windows directly, and on Linux with tools/Invoke-LinuxTestsInDocker.ps1.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Report every platform even when one fails.
      fail-fast: false
      matrix:
        # macos-latest is a possible later addition (macOS is best effort).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The full suite (each test with its own 300-second limit) took
    # about 8 minutes on an idle developer workstation. 45 minutes leaves
    # more than 5x margin for a slower hosted runner while still failing a
    # hung job far sooner than the 360-minute default.
    timeout-minutes: 45
    steps:
      # Actions are pinned to a full commit SHA; .github/dependabot.yml proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # Every check (the PowerShell version, the test suite, encoding, parse, Markdown fences and
      # links, script inventory, code language) lives in one script, shared with the local Linux
      # run in Docker.
      - name: CI checks
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Invoke-CiChecks.ps1
